{% extends 'base.html' %}
{% block title %}{{ place.name }} | RosaGo{% endblock %}
{% block content %}
<a class="back-link" href="{{ url_for('places_list') }}"><span aria-hidden="true">&larr;</span> Back to Explore</a>
<article class="place-detail">
    <p class="eyebrow">{{ place.category | capitalize }}</p>
    <h1>{{ place.name }}</h1>
    <p class="detail-address">{{ place.address }}</p>
    <div class="place-description">
        <h2>About this place</h2>
        <p>{{ place.description }}</p>
    </div>
</article>
{% endblock %}
