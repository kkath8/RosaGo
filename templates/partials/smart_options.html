<section class="card smart-options" data-smart-options><h2>Smart options</h2><p class="trip-help">Refine your recommendations using saved places, past visits and verified indoor settings. Your selected interests still determine which destinations are available.</p>
<div class="tgs"><label class="itinerary-choice"><input type="checkbox" name="skipVisited"> Skip places I have visited</label><label class="itinerary-choice"><input type="checkbox" name="savedFirst"> Saved places first</label><label class="itinerary-choice"><input type="checkbox" name="indoor"> Indoor-friendly (verified indoor/covered)</label></div>
<div class="field"><label for="smart-stops">Number of stops</label><select id="smart-stops" name="stops">{% for n in [0,2,3,4,5,6,10,20] %}<option value="{{ n }}">{{ (n|string)+' stops' if n else 'Auto (from pace)' }}</option>{% endfor %}</select></div>
<button class="site-button site-button-secondary" type="button" data-action="apply-smart">Apply to recommendations</button><p role="status" data-smart-status></p></section>
