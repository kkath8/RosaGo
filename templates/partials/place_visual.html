{# Render recorded photos only; the shared placeholder is presentation, never stored data. #}
{% set has_photo = place.image_url and ((place.image_url.startswith('https://') and place.image_url | length > 8) or (catalog_preview and place.image_url.startswith('/preview/images/'))) %}
<div class="destination-visual" data-category="{{ place.category }}">
    <img{% if not has_photo %} class="destination-photo-placeholder"{% endif %} data-destination-image data-placeholder-alt="Photo unavailable for {{ place.name }}" src="{{ place.image_url if has_photo else url_for('static', filename='img/destination-placeholder.svg') }}" alt="{{ place.name if has_photo else 'Photo unavailable for ' ~ place.name }}" loading="lazy" decoding="async" referrerpolicy="no-referrer">
</div>
