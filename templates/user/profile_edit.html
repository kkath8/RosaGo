<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="same-origin">
    <title>Edit Profile | RosaGO</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <main class="form-panel">
        <section class="registration-card" aria-labelledby="edit-title">
            <p class="eyebrow">RosaGO</p>
            <h1 id="edit-title">Edit Profile</h1>
            <p class="form-intro">Signed in as {{ user_email }}</p>
            <p class="field-help">Names may be blank. Use up to 100 characters per name.</p>
            {% for success in get_flashed_messages(category_filter=['profile_success']) %}
            <p class="form-status" role="status">{{ success }}</p>
            {% endfor %}
            <form method="post" action="{{ url_for('user_profile_edit') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf }}">
                <div class="field">
                    <label for="first-name">First Name</label>
                    <input id="first-name" name="first_name" type="text" autocomplete="given-name" value="{{ first_name }}">
                </div>
                <div class="field">
                    <label for="last-name">Last Name</label>
                    <input id="last-name" name="last_name" type="text" autocomplete="family-name" value="{{ last_name }}">
                </div>
                {% if message %}<p class="form-status" role="alert">{{ message }}</p>{% endif %}
                <button class="submit-button" type="submit">Save Changes</button>
            </form>
            <p class="login-prompt"><a href="{{ url_for('user_index') }}">Cancel / Back to profile</a></p>
        </section>
    </main>
</body>
</html>
