<div class="field-help" id="password-help" data-password-rules='{{ password_rules | tojson }}'>
    <p class="password-policy-heading">Password must contain:</p>
    <ul class="password-requirements">
        {% for rule in password_rules %}
        <li id="password-rule-{{ rule.key }}" data-password-requirement="{{ rule.key }}"><span id="password-rule-{{ rule.key }}-marker" class="password-requirement-marker" aria-hidden="true">○</span><span>{{ rule.label }}</span><span id="password-rule-{{ rule.key }}-state" class="password-requirement-state">Not met</span></li>
        {% endfor %}
    </ul>
</div>
